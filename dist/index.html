 pre{margin:6px 0 0;white-space:pre-wrap;font:13px/1.45 Consolas,monospace}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:13px}.arrow{border:0;background:none;color:var(--blue);padding:7px 1px;font-weight:650}.arrow:disabled{color:#69768b;opacity:.55;cursor:default}

'use strict';
const TOPICS = [{"number": 1, "title": "Первая программа и print", "tasks": [{"id": "1.1", "prompt": "Выведи на экран Привет, Python!.", "cases": [[[], "Привет, Python!"]]}, {"id": "1.2", "prompt": "Выведи своё имя.", "cases": [[[], "Алия"]]}, {"id": "1.3", "prompt": "Выведи Доброе утро! и Увидимся вечером! на двух строках.", "cases": [[[], "Доброе утро!\nУвидимся вечером!"]]}, {"id": "1.4", "prompt": "Выведи слова Я, изучаю и Python одной командой print(). Передай каждое слово отдельно.", "cases": [[[], "Я изучаю Python"]]}, {"id": "1.5", "prompt": "Выведи Он сказал: \"Привет!\" вместе с кавычками вокруг слова «Привет!».", "cases": [[[], "Он сказал: \"Привет!\""]]}]}, {"number": 2, "title": "Переменные", "tasks": [{"id": "2.1", "prompt": "Сохрани имя в переменной name и выведи её значение.", "cases": [[[], "Алия"]]}, {"id": "2.2", "prompt": "Сохрани название города в city, а название страны в country. Выведи их в одной строке.", "cases": [[[], "Алматы Казахстан"]]}, {"id": "2.3", "prompt": "Запиши в tickets число 2. Выведи его, затем присвой переменной 5 и выведи новое значение.", "cases": [[[], "2\n5"]]}, {"id": "2.4", "prompt": "Сохрани название фильма и количество билетов в двух переменных. Выведи их с подписями.", "cases": [[[], "Фильм: Интерстеллар\nБилетов: 2"]]}, {"id": "2.5", "prompt": "Присвой tickets значение 3, затем скопируй его в saved_tickets. Поменяй tickets на 7. Выведи обе переменные и проверь, какая из них изменилась.", "cases": [[[], "7 3"]]}]}, {"number": 3, "title": "Типы данных", "tasks": [{"id": "3.1", "prompt": "Сохрани 12 в переменной и узнай её тип.", "cases": [[[], "<class 'int'>"]]}, {"id": "3.2", "prompt": "Сохрани 1.5 в переменной и узнай её тип.", "cases": [[[], "<class 'float'>"]]}, {"id": "3.3", "prompt": "Проверь типы 7 и \"7\". Какой из них является строкой?", "cases": [[[], "<class 'int'>\n<class 'str'>"]]}, {"id": "3.4", "prompt": "Представь, что билеты доступны. Сохрани True в переменной available и выведи значение и его тип.", "cases": [[[], "True <class 'bool'>"]]}, {"id": "3.5", "prompt": "Преврати строку \"4\" в целое число и прибавь 2.", "cases": [[[], "6"]]}]}, {"number": 4, "title": "Арифметика", "tasks": [{"id": "4.1", "prompt": "Один билет стоит 1500 тенге. Посчитай стоимость трёх билетов.", "cases": [[[], "4500"]]}, {"id": "4.2", "prompt": "Заказ стоит 4500 тенге, покупатель дал 5000. Посчитай сдачу.", "cases": [[[], "500"]]}, {"id": "4.3", "prompt": "Три друга поровну делят счёт на 7500 тенге. Посчитай долю каждого.", "cases": [[[], "2500.0"]]}, {"id": "4.4", "prompt": "Взрослый билет стоит 1500 тенге, детский — 900. Посчитай стоимость двух взрослых и трёх детских билетов.", "cases": [[[], "5700"]]}, {"id": "4.5", "prompt": "Компания из четырёх человек купила по билету за 1500 тенге. Из стоимости заказа вычли 800 тенге. Посчитай, сколько заплатит каждый, если они разделят итог поровну.", "cases": [[[], "1300.0"]]}]}, {"number": 5, "title": "Ввод с клавиатуры", "tasks": [{"id": "5.1", "prompt": "Спроси имя пользователя и поздоровайся с ним.", "cases": [[["Алия"], null], [["Данияр"], null], [["Мадина"], null]]}, {"id": "5.2", "prompt": "Спроси, сколько билетов купили. Выведи общую стоимость при цене 1500 тенге за билет.", "cases": [[["3"], "4500"], [["1"], "1500"], [["7"], "10500"]]}, {"id": "5.3", "prompt": "Спроси возраст и выведи, сколько лет пользователю будет через год.", "cases": [[["18"], "19"], [["7"], "8"], [["32"], "33"]]}, {"id": "5.4", "prompt": "Спроси длину и ширину прямоугольника. Для обеих величин используй целые числа. Выведи его площадь.", "cases": [[["4", "6"], "24"], [["3", "9"], "27"], [["7", "2"], "14"]]}, {"id": "5.5", "prompt": "Спроси количество взрослых и детских билетов. Выведи число билетов и общую стоимость. Взрослый билет стоит 1500 тенге, детский — 900.", "cases": [[["2", "3"], "5 5700"], [["1", "4"], "5 5100"], [["3", "0"], "3 4500"]]}]}, {"number": 6, "title": "Условия if и else", "tasks": [{"id": "6.1", "prompt": "Спроси возраст. Если пользователю 18 лет или больше, выведи «Доступ открыт». В остальных случаях выведи «Доступ закрыт».", "cases": [[["17"], "Доступ закрыт"], [["18"], "Доступ открыт"], [["31"], "Доступ открыт"]]}, {"id": "6.2", "prompt": "Спроси температуру. Если она ниже нуля, выведи «Мороз». Иначе выведи «Ноль градусов или теплее».", "cases": [[["-1"], "Мороз"], [["0"], "Ноль градусов или теплее"], [["15"], "Ноль градусов или теплее"]]}, {"id": "6.3", "prompt": "Спроси два числа и выведи большее. Если они равны, можно вывести любое из них.", "cases": [[["3", "5"], "5"], [["5", "3"], "5"], [["3", "3"], "3"], [["-9", "-2"], "-2"]]}, {"id": "6.4", "prompt": "Спроси количество билетов. При заказе от пяти билетов вычти 500 тенге из общей стоимости. Цена билета — 1500 тенге. Проверь ввод 4 и 5.", "cases": [[["4"], "6000"], [["5"], "7000"], [["8"], "11500"]]}, {"id": "6.5", "prompt": "Спроси количество билетов. Если пользователь ввёл ноль или отрицательное число, выведи сообщение об ошибке. Иначе посчитай стоимость при цене 1500 тенге за билет.", "cases": [[["0"], null], [["-1"], null], [["3"], "4500"], [["7"], "10500"]]}]}, {"number": 7, "title": "Списки", "tasks": [{"id": "7.1", "prompt": "Создай список из трёх фильмов и выведи весь список.", "cases": [[[], "['Интерстеллар', 'ВАЛЛ-И', 'Рататуй']"]]}, {"id": "7.2", "prompt": "Из списка цен [1500, 2000, 2500] выведи первую цену.", "cases": [[[], "1500"]]}, {"id": "7.3", "prompt": "Из списка цен [1500, 2000, 2500] выведи последнюю цену, используя индекс -1.", "cases": [[[], "2500"]]}, {"id": "7.4", "prompt": "Узнай, сколько городов в списке [\"Алматы\", \"Астана\", \"Шымкент\", \"Тараз\"], с помощью len().", "cases": [[[], "4"]]}, {"id": "7.5", "prompt": "В списке цен [1500, 2000, 2500] замени вторую цену на 1800 и выведи обновлённый список.", "cases": [[[], "[1500, 1800, 2500]"]]}]}, {"number": 8, "title": "Цикл for", "tasks": [{"id": "8.1", "prompt": "Выведи каждое имя из списка [\"Алия\", \"Данияр\", \"Мадина\"] на отдельной строке.", "cases": [[[], "Алия\nДанияр\nМадина"]]}, {"id": "8.2", "prompt": "Для каждого числа в списке [2, 4, 6] выведи его удвоенное значение.", "cases": [[[], "4\n8\n12"]]}, {"id": "8.3", "prompt": "Сложи цены [1500, 900, 2000] с помощью цикла. Выведи итог после цикла.", "cases": [[[], "4400"]]}, {"id": "8.4", "prompt": "Из списка [900, 1500, 2200, 1200] выведи только цены от 1500 тенге.", "cases": [[[], "1500\n2200"]]}, {"id": "8.5", "prompt": "Посчитай, сколько цен в списке [1500, 900, 2200, 1500] равны 1500.", "cases": [[[], "2"]]}]}, {"number": 9, "title": "Функции", "tasks": [{"id": "9.1", "prompt": "Напиши функцию greet(name), которая возвращает приветствие с именем.", "cases": [[["Алия"], null], [["Данияр"], null]]}, {"id": "9.2", "prompt": "Напиши функцию square(number), которая возвращает квадрат числа.", "cases": [[[5], 25], [[-3], 9], [[0], 0], [[8], 64]]}, {"id": "9.3", "prompt": "Напиши функцию ticket_total(price, count), которая возвращает общую стоимость билетов.", "cases": [[[1500, 3], 4500], [[900, 4], 3600], [[120, 0], 0]]}, {"id": "9.4", "prompt": "Напиши функцию order_total(count). Билет стоит 1500 тенге. При покупке от пяти билетов действует скидка 500 тенге на весь заказ.", "cases": [[[4], 6000], [[5], 7000], [[8], 11500], [[1], 1500]]}, {"id": "9.5", "prompt": "Напиши функцию sum_prices(prices), которая принимает список цен и возвращает их сумму. Используй цикл. Проверь обычный и пустой списки.", "cases": [[[[1500, 900, 2000]], 4400], [[[]], 0], [[[2, 3, 9]], 14], [[[7]], 7]]}]}];
const GRADER = "\"\"\"Interpreter for the Python subset used by the classroom exercises.\"\"\"\n\nimport ast\nimport math\nimport operator\nimport re\n\n\nclass SandboxError(Exception):\n    pass\n\n\nclass ReturnValue(Exception):\n    pass\n\n\nclass BreakLoop(Exception):\n    pass\n\n\nclass ContinueLoop(Exception):\n    pass\n\n\nMAX_SOURCE = 16000\nMAX_STRING = 2048\nMAX_ITEMS = 256\nMAX_INT_BITS = 256\nMAX_OUTPUT = 8192\nVALUE_TYPES = (str, int, float, bool, list, tuple, range, type(None))\nTYPE_NAMES = {kind.__name__: kind for kind in VALUE_TYPES if kind is not type(None)}\nBINARY = {\n    ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,\n    ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod,\n    ast.Pow: operator.pow,\n}\nUNARY = {ast.UAdd: operator.pos, ast.USub: operator.neg, ast.Not: operator.not_}\nCOMPARE = {\n    ast.Eq: operator.eq, ast.NotEq: operator.ne, ast.Lt: operator.lt,\n    ast.LtE: operator.le, ast.Gt: operator.gt, ast.GtE: operator.ge,\n    ast.In: lambda a, b: a in b, ast.NotIn: lambda a, b: a not in b,\n    ast.Is: operator.is_, ast.IsNot: operator.is_not,\n}\nBUILTINS = {\n    **TYPE_NAMES, \"abs\": abs, \"len\": len, \"max\": max, \"min\": min,\n    \"round\": round, \"sum\": sum, \"sorted\": sorted, \"repr\": repr,\n    \"all\": all, \"any\": any,\n}\nMETHODS = {\n    str: {\"strip\": str.strip, \"upper\": str.upper, \"lower\": str.lower,\n          \"startswith\": str.startswith, \"endswith\": str.endswith,\n          \"count\": str.count, \"split\": str.split, \"join\": str.join},\n    list: {\"pop\": list.pop, \"count\": list.count, \"index\": list.index},\n    tuple: {\"count\": tuple.count, \"index\": tuple.index},\n}\nMETHOD_NAMES = {\"append\", \"__name__\"} | {\n    name for methods in METHODS.values() for name in methods\n}\nNODES = {\n    ast.Module, ast.Expr, ast.Constant, ast.Name, ast.Load, ast.Store,\n    ast.Assign, ast.AugAssign, ast.List, ast.Tuple, ast.Subscript, ast.Slice,\n    ast.BinOp, ast.UnaryOp, ast.BoolOp, ast.Compare, ast.IfExp,\n    ast.And, ast.Or, ast.Call, ast.keyword, ast.Attribute,\n    ast.JoinedStr, ast.FormattedValue, ast.If, ast.For, ast.While,\n    ast.Break, ast.Continue, ast.Pass, ast.FunctionDef, ast.arguments,\n    ast.arg, ast.Return, *BINARY, *UNARY, *COMPARE,\n}\nBLOCKED_NAMES = {\n    \"open\", \"eval\", \"exec\", \"compile\", \"getattr\", \"setattr\", \"delattr\",\n    \"globals\", \"locals\", \"vars\", \"dir\", \"help\", \"breakpoint\",\n    \"js\", \"pyodide\", \"os\", \"sys\", \"subprocess\",\n}\n\n\ndef bounded(value):\n    kind = type(value)\n    if kind is int and value.bit_length() > MAX_INT_BITS:\n        raise SandboxError(\"Слишком большое число.\")\n    if kind is float and not math.isfinite(value):\n        raise SandboxError(\"Число должно быть конечным.\")\n    if kind is str and len(value) > MAX_STRING:\n        raise SandboxError(\"Слишком длинная строка.\")\n    if kind in (list, tuple, range):\n        if len(value) > MAX_ITEMS:\n            raise SandboxError(\"Слишком много элементов.\")\n        if kind in (list, tuple):\n            chars = 0\n            for item in value:\n                if type(item) not in (str, int, float, bool, type(None)):\n                    raise SandboxError(\"В списках и кортежах используй простые значения.\")\n                bounded(item)\n                if type(item) is str:\n                    chars += len(item)\n            if chars > 2 * MAX_STRING:\n                raise SandboxError(\"Слишком много текста в списке.\")\n    if kind not in VALUE_TYPES and not (kind is type and value in VALUE_TYPES):\n        raise SandboxError(\"Этот тип данных недоступен в практикуме.\")\n    return value\n\n\ndef parse_submission(code):\n    if len(code) > MAX_SOURCE:\n        raise SandboxError(\"Решение слишком длинное.\")\n    tree = ast.parse(code, filename=\"solution.py\")\n    stack = [(tree, 0)]\n    count = 0\n    while stack:\n        node, depth = stack.pop()\n        count += 1\n        if count > 1200 or depth > 40:\n            raise SandboxError(\"Программа слишком сложная для практикума.\")\n        if type(node) not in NODES:\n            raise SandboxError(f\"Строка {getattr(node, 'lineno', '?')}. Эта команда недоступна в практикуме.\")\n        if isinstance(node, ast.Name) and (node.id.startswith(\"__\") or node.id in BLOCKED_NAMES):\n            raise SandboxError(f\"Строка {node.lineno}. Это имя недоступно в практикуме.\")\n        if isinstance(node, ast.Attribute) and node.attr not in METHOD_NAMES:\n            raise SandboxError(f\"Строка {node.lineno}. Этот атрибут недоступен в практикуме.\")\n        if isinstance(node, ast.Constant):\n            bounded(node.value)\n        if isinstance(node, ast.FunctionDef):\n            args = node.args\n            if (node.decorator_list or node.returns or args.defaults or args.kw_defaults or\n                args.vararg or args.kwarg or args.posonlyargs or args.kwonlyargs or\n                node.name.startswith(\"_\") or node.name in BLOCKED_NAMES or\n                any(a.annotation or a.arg.startswith(\"__\") or a.arg in BLOCKED_NAMES for a in args.args)):\n                raise SandboxError(f\"Строка {node.lineno}. Используй простое объявление функции с параметрами.\")\n        if isinstance(node, ast.keyword) and node.arg is None:\n            raise SandboxError(\"Распаковка аргументов недоступна в практикуме.\")\n        stack.extend((child, depth + 1) for child in ast.iter_child_nodes(node))\n    return tree\n\n\nclass Sandbox:\n    def __init__(self, inputs):\n        self.inputs = iter(inputs)\n        self.globals = {}\n        self.functions = {}\n        self.output = []\n        self.output_size = 0\n        self.steps = 20000\n        self.depth = 0\n\n    def tick(self, cost=1):\n        self.steps -= cost\n        if self.steps < 0:\n            raise SandboxError(\"Превышен лимит шагов. Проверь условие выхода из цикла.\")\n\n    def run(self, tree):\n        try:\n            self.block(tree.body, self.globals)\n        except (BreakLoop, ContinueLoop):\n            raise SandboxError(\"break и continue используются внутри цикла.\") from None\n        except ReturnValue:\n            raise SandboxError(\"return используется внутри функции.\") from None\n\n    def block(self, statements, env):\n        for node in statements:\n            self.statement(node, env)\n\n    def statement(self, node, env):\n        self.tick()\n        if isinstance(node, ast.Expr):\n            self.expr(node.value, env)\n        elif isinstance(node, ast.Assign):\n            value = self.expr(node.value, env)\n            for target in node.targets:\n                self.assign(target, value, env)\n        elif isinstance(node, ast.AugAssign):\n            if not isinstance(node.target, ast.Name):\n                raise SandboxError(\"Для сокращённого присваивания используй имя переменной.\")\n            value = self.binary(node.op, self.expr(node.target, env), self.expr(node.value, env))\n            self.assign(node.target, value, env)\n        elif isinstance(node, ast.If):\n            self.block(node.body if self.expr(node.test, env) else node.orelse, env)\n        elif isinstance(node, (ast.For, ast.While)):\n            if isinstance(node, ast.For):\n                values = self.sequence(self.expr(node.iter, env))\n                iterations = iter(values)\n            else:\n                iterations = iter(lambda: bool(self.expr(node.test, env)), False)\n            for value in iterations:\n                self.tick()\n                if isinstance(node, ast.For):\n                    self.assign(node.target, value, env)\n                try:\n                    self.block(node.body, env)\n                except ContinueLoop:\n                    continue\n                except BreakLoop:\n                    break\n            else:\n                self.block(node.orelse, env)\n        elif isinstance(node, ast.Break):\n            raise BreakLoop()\n        elif isinstance(node, ast.Continue):\n            raise ContinueLoop()\n        elif isinstance(node, ast.Return):\n            raise ReturnValue(self.expr(node.value, env) if node.value else None)\n        elif isinstance(node, ast.FunctionDef):\n            if env is not self.globals:\n                raise SandboxError(\"Объяви функцию в основном коде.\")\n            names = [arg.arg for arg in node.args.args]\n            if len(names) != len(set(names)):\n                raise SandboxError(\"Имена параметров функции должны различаться.\")\n            self.functions[node.name] = node\n        elif not isinstance(node, ast.Pass):\n            raise SandboxError(\"Эта команда недоступна в практикуме.\")\n\n    def assign(self, target, value, env):\n        if isinstance(target, ast.Name):\n            env[target.id] = value\n        elif isinstance(target, ast.Subscript):\n            seq = self.expr(target.value, env)\n            if type(seq) is not list or isinstance(target.slice, ast.Slice):\n                raise SandboxError(\"По индексу можно менять один элемент списка.\")\n            index = self.expr(target.slice, env)\n            updated = seq.copy()\n            updated[index] = value\n            bounded(updated)\n            seq[index] = value\n        elif isinstance(target, (ast.Tuple, ast.List)):\n            values = self.sequence(value)\n            if len(target.elts) != len(values):\n                raise ValueError(\"Количество значений не совпадает с количеством переменных.\")\n            for item, item_value in zip(target.elts, values):\n                self.assign(item, item_value, env)\n        else:\n            raise SandboxError(\"Используй имя переменной или индекс списка.\")\n\n    def expr(self, node, env):\n        self.tick()\n        if isinstance(node, ast.Constant):\n            return node.value\n        if isinstance(node, ast.Name):\n            if node.id in env:\n                return env[node.id]\n            if node.id in self.globals:\n                return self.globals[node.id]\n            if node.id in TYPE_NAMES:\n                return TYPE_NAMES[node.id]\n            raise NameError(f\"Имя {node.id} не определено.\")\n        if isinstance(node, (ast.List, ast.Tuple)):\n            if len(node.elts) > MAX_ITEMS:\n                raise SandboxError(\"Слишком много элементов.\")\n            values = [self.expr(element, env) for element in node.elts]\n            return bounded(values if isinstance(node, ast.List) else tuple(values))\n        if isinstance(node, ast.Subscript):\n            seq = self.sequence(self.expr(node.value, env))\n            index = node.slice\n            if isinstance(index, ast.Slice):\n                index = slice(*(self.expr(i, env) if i else None for i in (index.lower, index.upper, index.step)))\n            else:\n                index = self.expr(index, env)\n            return bounded(seq[index])\n        if isinstance(node, ast.BinOp):\n            return self.binary(node.op, self.expr(node.left, env), self.expr(node.right, env))\n        if isinstance(node, ast.UnaryOp):\n            return bounded(UNARY[type(node.op)](self.expr(node.operand, env)))\n        if isinstance(node, ast.BoolOp):\n            for value in node.values:\n                current = self.expr(value, env)\n                if bool(current) == isinstance(node.op, ast.Or):\n                    break\n            return current\n        if isinstance(node, ast.Compare):\n            left = self.expr(node.left, env)\n            for op, right_node in zip(node.ops, node.comparators):\n                right = self.expr(right_node, env)\n                if not COMPARE[type(op)](left, right):\n                    return False\n                left = right\n            return True\n        if isinstance(node, ast.IfExp):\n            return self.expr(node.body if self.expr(node.test, env) else node.orelse, env)\n        if isinstance(node, ast.Call):\n            return self.call(node, env)\n        if isinstance(node, ast.Attribute):\n            value = self.expr(node.value, env)\n            if type(value) is type and value in VALUE_TYPES and node.attr == \"__name__\":\n                return value.__name__\n            raise SandboxError(\"Этот атрибут недоступен в практикуме.\")\n        if isinstance(node, ast.JoinedStr):\n            text = \"\"\n            for value in node.values:\n                text = bounded(text + self.expr(value, env))\n            return text\n        if isinstance(node, ast.FormattedValue):\n            value = self.expr(node.value, env)\n            if node.conversion in (115, 114, 97):\n                value = bounded({115: str, 114: repr, 97: ascii}[node.conversion](value))\n            spec = self.expr(node.format_spec, env) if node.format_spec else \"\"\n            if not re.fullmatch(r\"[<>=^]?[+ -]?0?\\d{0,2}(?:\\.\\d{1,2})?[bcdEeFfgGnosxX%]?\", spec):\n                raise SandboxError(\"Такой формат f-строки недоступен в практикуме.\")\n            return bounded(format(value, spec))\n        raise SandboxError(\"Это выражение недоступно в практикуме.\")\n\n    @staticmethod\n    def sequence(value):\n        if type(value) not in (str, list, tuple, range):\n            raise TypeError(\"Ожидалась строка, список, кортеж или range().\")\n        return value\n\n    def binary(self, op, left, right):\n        if isinstance(op, ast.Mod) and isinstance(left, str):\n            raise SandboxError(\"Для подстановки в текст используй f-строку.\")\n        if isinstance(op, ast.Pow) and type(right) in (int, float, bool) and abs(right) > MAX_INT_BITS:\n            raise SandboxError(\"Слишком большая степень.\")\n        if isinstance(op, ast.Mult):\n            seq, n = (left, right) if type(left) in (str, list, tuple) else (right, left)\n            if type(seq) in (str, list, tuple) and type(n) in (int, bool):\n                limit = MAX_STRING if type(seq) is str else MAX_ITEMS\n                if len(seq) * max(0, n) > limit:\n                    raise SandboxError(\"Слишком много повторений.\")\n        return bounded(BINARY[type(op)](left, right))\n\n    def call(self, node, env):\n        args = [self.expr(arg, env) for arg in node.args]\n        kwargs = {item.arg: self.expr(item.value, env) for item in node.keywords}\n        if isinstance(node.func, ast.Attribute):\n            if kwargs:\n                raise SandboxError(\"Используй позиционные аргументы для методов.\")\n            return self.method(self.expr(node.func.value, env), node.func.attr, args)\n        if not isinstance(node.func, ast.Name):\n            raise SandboxError(\"Вызывай функции по имени.\")\n        name = node.func.id\n        if name in self.functions:\n            return self.call_function(name, args, kwargs)\n        if name == \"print\":\n            return self.print_values(args, kwargs)\n        if name == \"input\" and len(args) <= 1 and not kwargs:\n            try:\n                return next(self.inputs)\n            except StopIteration:\n                raise EOFError(\"Программа запросила больше значений, чем есть в тесте.\") from None\n        if name == \"type\" and len(args) == 1 and not kwargs:\n            return type(args[0])\n        if name not in BUILTINS:\n            raise SandboxError(f\"Функция {name} недоступна в практикуме.\")\n        return bounded(BUILTINS[name](*args, **kwargs))\n\n    def print_values(self, args, kwargs):\n        if kwargs.keys() - {\"sep\", \"end\"}:\n            raise SandboxError(\"Для print() доступны параметры sep и end.\")\n        sep, end = kwargs.get(\"sep\", \" \"), kwargs.get(\"end\", \"\\n\")\n        sep = \" \" if sep is None else sep\n        end = \"\\n\" if end is None else end\n        if type(sep) is not str or type(end) is not str:\n            raise TypeError(\"Параметры sep и end должны быть строками.\")\n        for index, value in enumerate(args):\n            if index:\n                self.write(sep)\n            self.write(str(value))\n        self.write(end)\n\n    def write(self, text):\n        self.output_size += len(text)\n        if self.output_size > MAX_OUTPUT:\n            raise SandboxError(\"Слишком много текста на экране.\")\n        self.output.append(text)\n\n    def method(self, value, name, args):\n        if type(value) is list and name == \"append\" and len(args) == 1:\n            bounded(value + args)\n            value.append(args[0])\n            return None\n        method = METHODS.get(type(value), {}).get(name)\n        if method is None:\n            raise SandboxError(f\"Метод {name} недоступен для этого значения.\")\n        if name == \"join\" and len(args) == 1:\n            items = self.sequence(args[0])\n            if all(type(item) is str for item in items) and (\n                sum(map(len, items)) + len(value) * max(0, len(items) - 1) > MAX_STRING\n            ):\n                raise SandboxError(\"Слишком длинная строка.\")\n        return bounded(method(value, *args))\n\n    def call_function(self, name, args, kwargs=None):\n        self.tick()\n        if self.depth >= 24:\n            raise SandboxError(\"Слишком много вложенных вызовов функций.\")\n        node = self.functions[name]\n        names = [a.arg for a in node.args.args]\n        kwargs = kwargs or {}\n        env = dict(zip(names, args))\n        if len(args) > len(names) or env.keys() & kwargs.keys() or (env.keys() | kwargs.keys()) != set(names):\n            raise TypeError(f\"Проверь аргументы функции {name}.\")\n        env.update(kwargs)\n        self.depth += 1\n        try:\n            self.block(node.body, env)\n        except ReturnValue as result:\n            return result.args[0]\n        except (BreakLoop, ContinueLoop):\n            raise SandboxError(\"break и continue используются внутри цикла.\") from None\n        finally:\n            self.depth -= 1\n        return None\n\n\nimport ast\nimport json\nimport math\nimport re\n\n\n\nNUM = r\"(?<![\\w.])[+-]?\\d+(?:[.,]\\d+)?(?![\\w.])\"\n\ndef norm(value):\n    return \" \".join(value.split()).casefold().rstrip(\".!\")\n\ndef numbers(value):\n    return [float(match.replace(\",\", \".\")) for match in re.findall(NUM, value)]\n\ndef numeric(actual, expected):\n    result = numbers(actual)\n    return bool(result) and math.isclose(result[-1], float(expected))\n\ndef structure(tree, task):\n    nodes = list(ast.walk(tree))\n    calls = [n for n in nodes if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)]\n    if task == \"1.4\":\n        prints = [n for n in calls if n.func.id == \"print\"]\n        if len(prints) != 1 or len(prints[0].args) != 3:\n            return \"Передай три слова как три аргумента одной команды print().\"\n    if task.startswith(\"5.\") or task.startswith(\"6.\"):\n        if not any(n.func.id == \"input\" for n in calls):\n            return \"Используй input(), чтобы прочитать данные.\"\n    if task.startswith(\"6.\") and not any(isinstance(n, (ast.If, ast.IfExp)) for n in nodes):\n        return \"Добавь условие if.\"\n    if task.startswith(\"8.\") or task == \"9.5\":\n        if not any(isinstance(n, ast.For) for n in nodes):\n            return \"Используй цикл for.\"\n    if task == \"7.4\" and not any(n.func.id == \"len\" for n in calls):\n        return \"Используй len() для подсчёта элементов.\"\n    if task == \"7.3\" and not any(isinstance(n, ast.Subscript) and\n        isinstance(n.slice, ast.UnaryOp) and isinstance(n.slice.op, ast.USub) and\n        isinstance(n.slice.operand, ast.Constant) and n.slice.operand.value == 1 for n in nodes):\n        return \"Обратись к последнему элементу через индекс -1.\"\n    ops = {\"4.1\": [ast.Mult], \"4.2\": [ast.Sub], \"4.3\": [ast.Div, ast.FloorDiv],\n           \"4.4\": [ast.Add, ast.Mult], \"4.5\": [ast.Sub, ast.Div, ast.FloorDiv]}\n    if task in ops:\n        kinds = ops[task]\n        if task in {\"4.3\", \"4.5\"}:\n            found_div = any(isinstance(n, (ast.Div, ast.FloorDiv)) for n in nodes)\n            if not found_div:\n                return \"Покажи вычисление доли с помощью деления.\"\n            kinds = [ast.Sub] if task == \"4.5\" else []\n        if any(not any(isinstance(n, kind) for n in nodes) for kind in kinds):\n            return \"Запиши вычисление в коде.\"\n    return \"\"\n\ndef check(task, output, expected, inputs, env):\n    text = output.strip()\n    if task == \"1.2\":\n        return any(char.isalpha() for char in text) and len(text.splitlines()) == 1\n    if task == \"2.1\":\n        return isinstance(env.get(\"name\"), str) and bool(env[\"name\"].strip()) and text == env[\"name\"].strip()\n    if task == \"2.2\":\n        return all(isinstance(env.get(key), str) and env[key].strip() and env[key] in text\n                   for key in (\"city\", \"country\")) and len(text.splitlines()) == 1\n    if task == \"2.3\":\n        return env.get(\"tickets\") == 5 and numbers(text) == [2, 5]\n    if task == \"2.4\":\n        values = [v for key, v in env.items() if key != \"__builtins__\"]\n        return (len(text.splitlines()) >= 2 and any(type(v) is int and v in numbers(text) for v in values)\n                and any(type(v) is str and bool(v.strip()) and v in text for v in values))\n    if task == \"2.5\":\n        return env.get(\"tickets\") == 7 and env.get(\"saved_tickets\") == 3 and numbers(text) == [7, 3]\n    if task in {\"3.1\", \"3.2\", \"3.3\", \"3.4\"}:\n        wanted = {\"3.1\":[\"int\"], \"3.2\":[\"float\"], \"3.3\":[\"int\", \"str\"], \"3.4\":[\"bool\"]}[task]\n        types = re.findall(r\"\\b(?:int|float|str|bool)\\b\", text)\n        return types == wanted and (task != \"3.4\" or (\"True\" in text and env.get(\"available\") is True))\n    if task == \"5.1\":\n        return inputs[0].casefold() in text.casefold() and any(\n            c.isalpha() for c in text.casefold().replace(inputs[0].casefold(), \"\", 1))\n    if task == \"5.5\":\n        return numbers(text) == numbers(expected)\n    if task == \"6.5\" and inputs and int(inputs[0]) <= 0:\n        return bool(text) and any(word in norm(text) for word in (\n            \"ошиб\", \"некоррект\", \"неверн\", \"недопуст\", \"должн\", \"положит\", \"больше\", \"нельзя\", \"минимум\", \"invalid\", \"error\"))\n    if task in {\"7.1\", \"7.5\"}:\n        try:\n            result = ast.literal_eval(text)\n        except (ValueError, SyntaxError):\n            return False\n        if task == \"7.1\":\n            return isinstance(result, list) and len(result) == 3 and all(isinstance(x, str) and x.strip() for x in result)\n        return result == [1500, 1800, 2500] and any(\n            isinstance(v, list) and v == result for key, v in env.items() if key != \"__builtins__\")\n    if task in {\"6.1\", \"6.2\"}:\n        return norm(text) == norm(expected)\n    if task.startswith(\"1.\"):\n        return text == expected\n    if task in {\"8.1\", \"8.2\", \"8.4\"}:\n        return [line.strip() for line in text.splitlines() if line.strip()] == expected.splitlines()\n    return numeric(text, expected)\n\nFUNCTIONS = {\n    \"9.1\": \"greet\", \"9.2\": \"square\", \"9.3\": \"ticket_total\",\n    \"9.4\": \"order_total\", \"9.5\": \"sum_prices\",\n}\n\n\ndef grade(payload):\n    task, code, cases = payload[\"id\"], payload[\"code\"], payload[\"cases\"]\n    try:\n        tree = parse_submission(code)\n    except SyntaxError as exc:\n        return {\"status\": \"error\", \"detail\": f\"Строка {exc.lineno}: {exc.msg}\"}\n    except (SandboxError, RecursionError) as exc:\n        return {\"status\": \"blocked\", \"detail\": str(exc)[:750]}\n    hint = structure(tree, task)\n    if hint:\n        return {\"status\": \"wrong\", \"passed\": 0, \"total\": len(cases), \"detail\": hint}\n\n    for i, (inputs, expected) in enumerate(cases):\n        sandbox = Sandbox(inputs if task not in FUNCTIONS else [])\n        try:\n            sandbox.run(tree)\n            if task in FUNCTIONS:\n                name = FUNCTIONS[task]\n                if name not in sandbox.functions:\n                    return {\"status\": \"wrong\", \"passed\": 0, \"total\": len(cases),\n                            \"detail\": f\"Определи функцию {name} с помощью def.\"}\n                args = [value.copy() if type(value) is list else value for value in inputs]\n                actual = sandbox.call_function(name, args)\n                if task == \"9.1\":\n                    passed = (isinstance(actual, str) and inputs[0].casefold() in actual.casefold()\n                              and any(c.isalpha() for c in actual.casefold().replace(inputs[0].casefold(), \"\", 1)))\n                else:\n                    passed = type(actual) in (int, float) and actual == expected\n                observed = repr(actual)\n            else:\n                observed = \"\".join(sandbox.output).strip()\n                passed = check(task, observed, expected, inputs, sandbox.globals)\n                if next(sandbox.inputs, None) is not None:\n                    passed = False\n        except SandboxError as exc:\n            return {\"status\": \"blocked\", \"passed\": i, \"total\": len(cases), \"detail\": str(exc)[:750]}\n        except (ValueError, TypeError, NameError, IndexError, EOFError, ArithmeticError) as exc:\n            return {\"status\": \"error\", \"passed\": i, \"total\": len(cases), \"detail\": f\"{type(exc).__name__}: {exc}\"[:750]}\n        if not passed:\n            return {\"status\": \"wrong\", \"passed\": i, \"total\": len(cases), \"detail\": f\"Проверь результат теста {i + 1}.\",\n                    \"inputs\": inputs, \"actual\": observed[:900]}\n    return {\"status\": \"ok\", \"passed\": len(cases), \"total\": len(cases)}\n\n\n\ndef grade_json(raw):\n    return json.dumps(grade(json.loads(raw)), ensure_ascii=False)\n\n\n";
const CDN = 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/';
const TASKS = TOPICS.flatMap(t => t.tasks);
const KEY = 'python-practice-45:v1';
const by = id => document.getElementById(id);
const editor = by('code');
const outcomes = new Map();
let work = {}, active = 0, pending, runner, ready = false, timer;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  if (saved && typeof saved === 'object') work = saved;
} catch {}
function store() { try { localStorage.setItem(KEY, JSON.stringify(work)); } catch {} }
function entry(task) { return work[task.id] ??= {}; }
function button(label, className, fn) {
  const node = document.createElement('button');
  node.type = 'button'; node.className = className; node.textContent = label;
  node.addEventListener('click',fn);
  return node;
}
function result(value) {
  const node = by('feedback');
  node.replaceChildren(); node.hidden = !value;
  if (!value) return;
  node.className = 'feedback ' + value.status;
  const heading = document.createElement('strong');
  heading.textContent = {ok:'Решение принято',wrong:'Пока не принято',blocked:'Ограничение практикума',error:'Ошибка',busy:'Проверка'}[value.status];
  const detail = document.createElement('div');
  detail.textContent = value.status === 'ok' ? 'Пройдено тестов: ' + value.passed + ' из ' + value.total : value.detail;
  node.append(heading, detail);
  if ('actual' in value) {
    const sample = document.createElement('pre');
    sample.textContent = (value.inputs.length ? 'Данные теста: ' + JSON.stringify(value.inputs) + '\n' : '') +
      'Твой результат: ' + (value.actual || 'нет вывода');
    node.append(sample);
  }
}
function nav() {
  const current = TASKS[active], topic = TOPICS[Math.floor(active / 5)];
  const focus = document.activeElement?.dataset.control;
  by('topics').replaceChildren();
  for (const item of TOPICS) {
    const b = button('', 'topic', () => select((item.number - 1) * 5));
    b.dataset.control = 'topic-' + item.number;
    if (item === topic) b.setAttribute('aria-current','true');
    const num = document.createElement('span'); num.textContent = String(item.number).padStart(2,'0');
    const name = document.createElement('span'); name.textContent = item.title;
    const score = document.createElement('small'); score.textContent = item.tasks.filter(t => work[t.id]?.accepted).length + '/5';
    b.append(num,name,score); by('topics').append(b);
  }
  by('topic-select').value = topic.number;
  by('number').textContent = 'Тема ' + String(topic.number).padStart(2,'0');
  by('topic-title').textContent = topic.title;
  by('tasks').replaceChildren();
  for (const task of topic.tasks) {
    const passed = Boolean(work[task.id]?.accepted);
    const b = button(task.id + (passed ? ' ✓' : ''), 'task', () => select(TASKS.indexOf(task)));
    b.dataset.control = 'task-' + task.id;
    if (task === current) b.setAttribute('aria-current','true');
    if (passed) b.setAttribute('aria-label', 'Задача ' + task.id + ' принята');
    by('tasks').append(b);
  }
  if (focus) [...document.querySelectorAll('[data-control]')].find(el => el.dataset.control === focus)?.focus({preventScroll:true});
  const n = TASKS.filter(t => work[t.id]?.accepted).length;
  by('score').textContent = n + ' из ' + TASKS.length + ' принято';
  by('progress').value = n;
  by('export').disabled = n === 0;
}
function sync() {
  const task = TASKS[active], saved = entry(task), last = outcomes.get(task.id);
  by('submit').disabled = Boolean(pending);
  if (pending?.task === task) result({status:'busy',detail:pending.stage});
  else if (last?.code === editor.value) result(last.verdict);
  else if (saved.accepted && saved.accepted === editor.value)
    result({status:'ok',passed:task.cases.length,total:task.cases.length});
  else result(null);
}
function select(i) {
  if (i < 0 || i >= TASKS.length) return;
  active = i;
  const task = TASKS[i];
  nav();
  by('task-title').textContent = 'Задача ' + task.id;
  by('condition').textContent = task.prompt;
  editor.value = entry(task).draft || '';
  by('prev').disabled = i === 0;
  by('next').disabled = i === TASKS.length - 1;
  sync();
}
function finish(verdict, reset = false) {
  if (!pending) return;
  clearTimeout(timer);
  const {task,code} = pending;
  pending = undefined;
  if (reset) { runner?.terminate(); runner = undefined; ready = false; }
  outcomes.set(task.id,{code,verdict});
  if (verdict.status === 'ok') {
    entry(task).accepted = code;
    store(); nav();
  }
  sync();
}
function workerMain(base, grader) {
  let gradePython;
  self.onmessage = async ({data}) => {
    try {
      if (data.type === 'start') {
        importScripts(base + 'pyodide.js');
        const runtime = await loadPyodide({indexURL:base});
        runtime.runPython(grader);
        gradePython = runtime.globals.get('grade_json');
        postMessage({type:'ready'});
      } else {
        const verdict = JSON.parse(gradePython(JSON.stringify(data.payload)));
        postMessage({type:'result',verdict});
      }
    } catch {
      postMessage({type:'error',stage:data.type});
    }
  };
}
function run() {
  clearTimeout(timer);
  pending.stage = 'Запускаю тесты…'; sync();
  timer = setTimeout(() => finish({status:'error',detail:'Код выполнялся слишком долго. Проверь, заканчивается ли цикл.'},true),4000);
  runner.postMessage({type:'grade',payload:{id:pending.task.id,cases:pending.task.cases,code:pending.code}});
}
function grade() {
  if (pending) return;
  const task = TASKS[active], code = editor.value;
  if (!code.trim()) { result({status:'wrong',detail:'Сначала вставь или напиши код.'}); editor.focus(); return; }
  pending = {task,code,stage:'Загружаю Python. Первый запуск может занять несколько секунд…'};
  sync();
  if (ready) { run(); return; }
  timer = setTimeout(() => finish({status:'error',detail:'Python долго загружается. Проверь интернет и повтори попытку.'},true),45000);
  const source = '(' + workerMain.toString() + ')(' + JSON.stringify(CDN) + ',' + JSON.stringify(GRADER) + ');';
  const url = URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  try {
    runner = new Worker(url);
    runner.onmessage = ({data}) => {
      if (!pending) return;
      if (data.type === 'ready') { ready = true; run(); }
      else if (data.type === 'result') finish(data.verdict);
      else finish({status:'error',detail:data.stage === 'start' ?
        'Не удалось загрузить Python. Проверь интернет и попробуй снова.' : 'Проверка прервалась. Попробуй снова.'},true);
    };
    runner.onerror = () => finish({status:'error',detail:'Браузер не смог запустить Python. Проверь подключение.'},true);
    runner.postMessage({type:'start'});
  } catch { finish({status:'error',detail:'Этот браузер не смог запустить проверку.'},true); }
  finally { URL.revokeObjectURL(url); }
}
for (const topic of TOPICS) {
  const item = document.createElement('option');
  item.value = topic.number; item.textContent = topic.number + '. ' + topic.title;
  by('topic-select').append(item);
}
by('topic-select').onchange = e => select((Number(e.target.value) - 1) * 5);
by('prev').onclick = () => select(active - 1);
by('next').onclick = () => select(active + 1);
by('submit').onclick = grade;
editor.oninput = () => { entry(TASKS[active]).draft = editor.value; store(); sync(); };
editor.onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); grade(); }
};
by('export').onclick = () => {
  const accepted = TASKS.filter(task => work[task.id]?.accepted);
  const content = ['Практикум по Python', 'Принято ' + accepted.length + ' из ' + TASKS.length,
    ...accepted.map(task => 'Задача ' + task.id + '\n\n' + work[task.id].accepted)].join('\n\n');
  const url = URL.createObjectURL(new Blob(['\ufeff',content],{type:'text/plain;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url; link.download = 'python-resheniya.txt'; link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};
select(0);
</script>
</body>
</html>
